<!DOCTYPE html>
<html lang="en">
<head>

                        </tr>

                        <tr>
                            <td><img src="img/cuadrado.png" alt="cuadrado" class="img-fluid"></td>
                            <td><img src="img/cuadrado.png" alt="cuadrado" class="img-fluid"></td>
                            <td><img src="img/cuadrado.png" alt="cuadrado" class="img-fluid"></td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </main>

    </div>

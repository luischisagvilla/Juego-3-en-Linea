<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres en raya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>

<body>
    <div class="container pb-5" style="background-color: rgb(224, 160, 22);">

        <header>
            <div class="row">
                <div class="col m-4">
                    <h1 class="text-center fw-bold">Juego 3 en Linea</h1>
                </div>
            </div>
        </header>

        <main>
            <div class="row align-items-center m-2">

                <div class="col-4 d-flex flex-column align-items-center">
                    <img src="img/x.png" alt="X" class="img-fluid w-50">
                </div>

                <div class="col-8 d-flex flex-column align-items-center">
                    <input type="text" id="nombre1" name="nombre1">
                </div>

            </div>

            <div class="row align-items-center m-2">

                <div class="col-4 d-flex flex-column align-items-center">
                    <img src="img/circulo.png" alt="O" class="img-fluid w-50">
                </div>

                <div class="col-8 d-flex flex-column align-items-center">
                    <input type="text" id="nombre2" name="nombre2">
                </div>

                <div class="col-12 d-flex flex-column align-items-center mt-4">
                    <button style="background-color: rgb(219, 88, 12);" 
                    class="btn btn-lg px-5 py-2 rounded-pill shadow fw-bold" 
                    onclick="iniciarJuego()">Iniciar Juego</button>
                    <h1 class="m-4">Turno: <span id="turno"></span></h1>
                </div>

            </div>

            <div class="border rounded-3 overflow-auto ms-5 me-5 mb-5">
                <table class="table table-striped mb-0">
                    <tbody>

                        <tr>
                            <td><img src="img/cuadrado.png" id="cuadro0" onclick="marcarCuadro(0)" alt="cuadrado" class="img-fluid"></td>
                            <td><img src="img/cuadrado.png" id="cuadro1" onclick="marcarCuadro(1)" alt="cuadrado" class="img-fluid"></td>
                            <td><img src="img/cuadrado.png" id="cuadro2" onclick="marcarCuadro(2)" alt="cuadrado" class="img-fluid"></td>
                        </tr>

                        <tr>
                            <td><img src="img/cuadrado.png" id="cuadro3" onclick="marcarCuadro(3)" alt="cuadrado" class="img-fluid"></td>
                            <td><img src="img/cuadrado.png" id="cuadro4" onclick="marcarCuadro(4)" alt="cuadrado" class="img-fluid"></td>
                            <td><img src="img/cuadrado.png" id="cuadro5" onclick="marcarCuadro(5)" alt="cuadrado" class="img-fluid"></td>
                        </tr>

                        <tr>
                            <td><img src="img/cuadrado.png" id="cuadro6" onclick="marcarCuadro(6)" alt="cuadrado" class="img-fluid"></td>
                            <td><img src="img/cuadrado.png" id="cuadro7" onclick="marcarCuadro(7)" alt="cuadrado" class="img-fluid"></td>
                            <td><img src="img/cuadrado.png" id="cuadro8" onclick="marcarCuadro(8)" alt="cuadrado" class="img-fluid"></td>
                        </tr>

                    </tbody>
                </table>
            </div>

        </main>

    </div>
    
    <script>
        let jugadorActual = 1;
        let nombreJugador1 = "";
        let nombreJugador2 = "";
        let tablero = [0, 0, 0, 0, 0, 0, 0, 0, 0];
        let combGanadoras = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function iniciarJuego(){
            nombreJugador1 = document.getElementById("nombre1").value;
            nombreJugador2 = document.getElementById("nombre2").value;

            jugadorActual = 1;

            tablero = [0, 0, 0, 0, 0, 0, 0, 0, 0];
            
            document.getElementById("turno").innerHTML = nombreJugador1;

            for (let i = 0; i < 9; i++){
                document.getElementById("cuadro" + i).src = "img/cuadrado.png";
            }
        }

        function marcarCuadro(posicion){
            let cuadro = document.getElementById("cuadro" + posicion);

            if (jugadorActual == 1){
                cuadro.src = "img/x.png";
                tablero[posicion] = 1;
            }else{
                cuadro.src = "img/circulo.png";
                tablero[posicion] = 2;
            }

            if (determinarGanador()){
                return;
            }

            if (jugadorActual == 1){
                jugadorActual = 2;
                document.getElementById("turno").innerHTML = nombreJugador2;
            }else{
                jugadorActual = 1;
                document.getElementById("turno").innerHTML = nombreJugador1;
            }

        }

        function determinarGanador(){
            for (let i=0; i<combGanadoras.length; i++){
                let a = combGanadoras[i][0];
                let b = combGanadoras[i][1];
                let c = combGanadoras[i][2];

                if(tablero[a] != 0 && tablero[a] == tablero[b] && tablero[a] == tablero[c]){
                    if(tablero[a]==1){
                        alert("El ganador es: " + nombreJugador1);
                    }else{
                        alert("El ganador es: " + nombreJugador2);
                    }
                    return true;
                }
            }
            return false;
        }

    </script>
</body>

</html>
